<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" role="img" aria-labelledby="t d">
<title id="t">Wearable antenna — spectral field atlas</title><desc id="d">Isometric copper textile patch on a deep green technical grid, encircled by luminous radio-frequency waves.</desc>
<defs>
 <radialGradient id="halo"><stop stop-color="#2acaa4" stop-opacity=".28"/><stop offset=".53" stop-color="#176d69" stop-opacity=".09"/><stop offset="1" stop-color="#081a1b" stop-opacity="0"/></radialGradient>
 <linearGradient id="cu" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ffd8a8"/><stop offset=".42" stop-color="#d18f58"/><stop offset="1" stop-color="#87573e"/></linearGradient>
 <linearGradient id="substrate" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#3b8576"/><stop offset="1" stop-color="#103e3d"/></linearGradient>
 <linearGradient id="trace" x1="0" x2="1"><stop stop-color="#75f6d9" stop-opacity="0"/><stop offset=".42" stop-color="#75f6d9"/><stop offset="1" stop-color="#75f6d9" stop-opacity="0"/></linearGradient>
 <pattern id="cloth" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 0V12 M6 0V12 M0 0H12 M0 6H12" stroke="#98c7a9" stroke-opacity=".12" stroke-width=".55"/></pattern>
 <pattern id="cuMesh" width="15" height="15" patternUnits="userSpaceOnUse"><path d="M0 0L15 15M15 0L0 15" stroke="#ffe1af" stroke-opacity=".15" stroke-width=".6"/></pattern>
 <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="18"/></filter>
 </defs>
 <circle cx="453" cy="406" r="400" fill="url(#halo)"/>
