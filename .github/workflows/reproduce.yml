name: Validate research results
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/reproduce.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: bash run_all.sh --full
      - uses: actions/upload-artifact@v4
        with:
          name: wearable-antenna-validation
          path: |
            results/
            docs/index.html
            docs/downloads/
